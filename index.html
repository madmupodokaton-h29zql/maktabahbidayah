    function escapeRegExp(str = '') {

    // ==========================================
    // NORMALISASI & REGEX PENCARIAN ARAB TANPA HARAKAT (DIACRITIC-INSENSITIVE)
    // ==========================================
    const ARABIC_DIACRITICS_CLASS = '[\\u0610-\\u061A\\u0640\\u064B-\\u065F\\u0670\\u06D6-\\u06DC\\u06DF-\\u06E8\\u06EA-\\u06ED]';
    const ARABIC_DIACRITICS_STRIP_REGEX = new RegExp(ARABIC_DIACRITICS_CLASS, 'g');

    function normalizeSearchText(str = '') {
      return String(str)
        .replace(ARABIC_DIACRITICS_STRIP_REGEX, '')
        .replace(/[أإآٱ]/g, 'ا')
        .replace(/[ؤ]/g, 'و')
        .replace(/[ئى]/g, 'ي')
        .replace(/ک/g, 'ك')
        .replace(/ی/g, 'ي')
        .toLowerCase();
    }

    function buildArabicAwarePattern(keyword = '') {
      const stripped = String(keyword || '').replace(ARABIC_DIACRITICS_STRIP_REGEX, '').trim();
      if (!stripped) return '';

      const chars = Array.from(stripped);
      return chars.map(ch => {
        if (/\s/.test(ch)) {
          return '\\s+';
        }
        let charGroup = '';
        if (/[اأإآٱ]/.test(ch)) {
          charGroup = '[اأإآٱ]';
        } else if (/[وؤ]/.test(ch)) {
          charGroup = '[وؤ]';
        } else if (/[يئىی]/.test(ch)) {
          charGroup = '[يئىی]';
        } else if (/[كک]/.test(ch)) {
          charGroup = '[كک]';
        } else if (/[هة]/.test(ch)) {
          charGroup = '[هة]';
        } else {
          charGroup = escapeRegExp(ch);
        }
        return charGroup + ARABIC_DIACRITICS_CLASS + '*';
      }).join('');
    }

    function buildCombinedSearchRegex(keywords = []) {
      const validKeywords = (keywords || [])
        .map(k => String(k || '').replace(ARABIC_DIACRITICS_STRIP_REGEX, '').trim())
        .filter(Boolean)
        .sort((a, b) => b.length - a.length);

      if (!validKeywords.length) return null;

      const patterns = validKeywords.map(k => buildArabicAwarePattern(k)).filter(Boolean);
      if (!patterns.length) return null;

      return new RegExp(`(${patterns.join('|')})`, 'gi');
    }

    function highlightTextWithKeywords(text = '', keywords = []) {
      const rawText = String(text || '');
      if (!rawText) return '';

      const regex = buildCombinedSearchRegex(keywords);
      if (!regex) return escapeHtml(rawText);

      let result = '';
      let lastIndex = 0;
      let match;

      regex.lastIndex = 0;
      while ((match = regex.exec(rawText)) !== null) {
        if (match.index > lastIndex) {
          result += escapeHtml(rawText.slice(lastIndex, match.index));
        }
        result += `<mark class="search-highlight">${escapeHtml(match[0])}</mark>`;
        lastIndex = regex.lastIndex;
        if (match[0].length === 0) regex.lastIndex++;
      }

      if (lastIndex < rawText.length) {
        result += escapeHtml(rawText.slice(lastIndex));
      }

      return result;
    }

    function highlightHtmlContent(html = '', keywords = []) {
      if (!html) return html;
      const regex = buildCombinedSearchRegex(keywords);
      if (!regex) return html;

      const wrapper = document.createElement('div');
      wrapper.innerHTML = html;

      const textNodes = [];
      const collectTextNodes = (node) => {
        if (node.nodeType === 3) {
          if (node.nodeValue && node.nodeValue.trim().length > 0) {
            textNodes.push(node);
          }
        } else if (
          node.nodeType === 1 &&
          node.nodeName !== 'MARK' &&
          node.nodeName !== 'SCRIPT' &&
          node.nodeName !== 'STYLE'
        ) {
          for (let i = 0; i < node.childNodes.length; i++) {
            collectTextNodes(node.childNodes[i]);
          }
        }
      };

      collectTextNodes(wrapper);

      textNodes.forEach(textNode => {
        const text = textNode.nodeValue;
        regex.lastIndex = 0;
        if (!regex.test(text)) return;

        regex.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let lastIdx = 0;
        let match;

        while ((match = regex.exec(text)) !== null) {
          if (match.index > lastIdx) {
            frag.appendChild(document.createTextNode(text.slice(lastIdx, match.index)));
          }
          const markEl = document.createElement('mark');
          markEl.className = 'search-highlight';
          markEl.textContent = match[0];
          frag.appendChild(markEl);
          lastIdx = regex.lastIndex;
          if (match[0].length === 0) regex.lastIndex++;
        }

        if (lastIdx < text.length) {
          frag.appendChild(document.createTextNode(text.slice(lastIdx)));
        }

        if (textNode.parentNode) {
          textNode.parentNode.replaceChild(frag, textNode);
        }
      });

      return wrapper.innerHTML;
    }

    function parseHtmlIntoBlocks(htmlContent = '') {
      const isHtml = /<[a-z][\s\S]*>/i.test(htmlContent || '');
      const normalizedHtml = isHtml
        ? htmlContent
        : String(htmlContent || '')
            .split('\n')
            .map(line => `<p>${escapeHtml(line)}</p>`)
            .join('');

      const temp = document.createElement('div');
      temp.innerHTML = normalizedHtml;

      const blocks = [];
      Array.from(temp.childNodes).forEach(node => {
        if (node.nodeType === 1) {
          const text = (node.textContent || '').trim();
          const hasBr = node.querySelector && node.querySelector('br');
          if (text.length > 0 || hasBr) {
            blocks.push({
              html: node.outerHTML,
              text: text,
              dir: node.getAttribute('dir') || node.style?.direction || (node.classList?.contains('ql-direction-rtl') ? 'rtl' : '')
            });
          }
        } else if (node.nodeType === 3) {
          const text = (node.nodeValue || '').trim();
          if (text.length > 0) {
            blocks.push({
              html: `<p>${escapeHtml(text)}</p>`,
              text: text,
              dir: ''
            });
          }
        }
      });

      return blocks;
    }

    function getSmartSearchSnippets(htmlContent = '', keywords = [], expandLevel = 0) {
      const blocks = parseHtmlIntoBlocks(htmlContent);
      const nonEmptyBlocks = blocks.filter(b => b.text.length > 0);

      if (nonEmptyBlocks.length === 0) {
        return { html: '<p class="text-gray-400">Tidak ada isi tulisan.</p>', canExpandMore: false, canCollapse: false };
      }

      const validKeywords = (keywords || [])
        .map(k => (k || '').trim())
        .filter(Boolean);

      if (validKeywords.length === 0) {
        const countByLevel = [1, 3, 6, nonEmptyBlocks.length];
        const takeCount = countByLevel[Math.min(expandLevel, countByLevel.length - 1)];
        const selected = nonEmptyBlocks.slice(0, takeCount);

        return {
          html: selected.map(b => b.html).join(''),
          canExpandMore: nonEmptyBlocks.length > takeCount,
          canCollapse: expandLevel > 0
        };
      }

      const matchedIndices = [];
      const normalizedKeywords = validKeywords.map(kw => normalizeSearchText(kw)).filter(Boolean);

      nonEmptyBlocks.forEach((b, idx) => {
        const normalizedBlockText = normalizeSearchText(b.text);
        const isHit = normalizedKeywords.some(nkw => normalizedBlockText.includes(nkw));
        if (isHit) matchedIndices.push(idx);
      });

      if (matchedIndices.length === 0) {
        const countByLevel = [1, 3, 6, nonEmptyBlocks.length];
        const takeCount = countByLevel[Math.min(expandLevel, countByLevel.length - 1)];
        const selected = nonEmptyBlocks.slice(0, takeCount);

        return {
          html: highlightHtmlContent(selected.map(b => b.html).join(''), validKeywords),
          canExpandMore: nonEmptyBlocks.length > takeCount,
          canCollapse: expandLevel > 0
        };
      }

      if (expandLevel >= 3) {
        return {
          html: highlightHtmlContent(blocks.map(b => b.html).join(''), validKeywords),
          canExpandMore: false,
          canCollapse: true
        };
      }

      const neighborRadius = expandLevel === 0 ? 0 : (expandLevel === 1 ? 1 : 3);
      const maxHitSeeds = expandLevel === 0 ? 2 : (expandLevel === 1 ? 4 : matchedIndices.length);

      const includedIndicesSet = new Set();
      matchedIndices.slice(0, maxHitSeeds).forEach(hitIdx => {
        const start = Math.max(0, hitIdx - neighborRadius);
        const end = Math.min(nonEmptyBlocks.length - 1, hitIdx + neighborRadius);
        for (let i = start; i <= end; i++) {
          includedIndicesSet.add(i);
        }
      });

      const sortedIndices = Array.from(includedIndicesSet).sort((a, b) => a - b);
      const hasMoreBlocks = sortedIndices.length < nonEmptyBlocks.length;

      let assembledHtml = '';
      let prevIdx = -1;

      sortedIndices.forEach(idx => {
        if (prevIdx !== -1 && idx > prevIdx + 1) {
          assembledHtml += `<div class="my-2 text-center text-xs text-amber-600/80 font-semibold select-none">• • •</div>`;
        }
        const blockObj = nonEmptyBlocks[idx];
        assembledHtml += highlightHtmlContent(blockObj.html, validKeywords);
        prevIdx = idx;
      });

      return {
        html: assembledHtml,
        canExpandMore: hasMoreBlocks,
        canCollapse: expandLevel > 0
      };
    }

    function applyBlockFormatToSelection(options = {}) {
      const board = document.getElementById('rich-editor-board');
      if (!board) return;
      board.focus();

      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return;

      const range = sel.getRangeAt(0);
      if (!board.contains(range.commonAncestorContainer)) return;

      const blockTags = ['P', 'DIV', 'H1', 'H2', 'H3', 'H4', 'BLOCKQUOTE', 'LI'];
      const getClosestBlock = (node) => {
        let curr = node.nodeType === 3 ? node.parentNode : node;
        while (curr && curr !== board) {
          if (blockTags.includes(curr.nodeName)) return curr;
          curr = curr.parentNode;
        }
        return null;
      };

      const blocks = new Set();
      let startBlock = getClosestBlock(range.startContainer);
      let endBlock = getClosestBlock(range.endContainer);

      if (startBlock) blocks.add(startBlock);
      if (endBlock) blocks.add(endBlock);

      Array.from(board.querySelectorAll('p, div, h1, h2, h3, h4, blockquote, li')).forEach(el => {
        if (sel.containsNode && sel.containsNode(el, true)) {
          blocks.add(el);
        }
      });

      if (blocks.size === 0) {
        document.execCommand('formatBlock', false, 'P');
        const createdBlock = getClosestBlock(sel.anchorNode);
        if (createdBlock) blocks.add(createdBlock);
      }

      blocks.forEach(block => {
        if (options.dir) {
          block.setAttribute('dir', options.dir);
          block.style.direction = options.dir;
          if (!options.align) {
            block.style.textAlign = options.dir === 'rtl' ? 'right' : 'left';
          }
        }
        if (options.align) {
          block.style.textAlign = options.align;
        }
      });
    }

    // CRUD REFERENSI
    async function handleSaveReference(e) {
      e.preventDefault();
      if (state.currentUser?.role !== 'admin') return;

      const name = document.getElementById('ref-form-name')?.value?.trim();
      const description = document.getElementById('ref-form-desc')?.value?.trim() || '';

      if (!name) {
        showToast('Nama Sumber/Referensi wajib diisi.', 'error');
        return;
      }

      saveCurrentScrollPosition();
      const payload = { name, description };

      if (IS_PREVIEW) {
        if (state.editingReferenceId) {
          const existingRef = state.references.find(r => r.id === state.editingReferenceId);
          const oldName = existingRef ? existingRef.name : '';

          const idx = state.references.findIndex(r => r.id === state.editingReferenceId);
          if (idx > -1) {
            state.references[idx] = { ...state.references[idx], ...payload };
          } else {
            state.references.push({ id: 'ref-' + Date.now(), ...payload });
          }

          if (oldName && oldName !== name) {
            state.articles.forEach(art => {
              if ((art.reference || '').trim() === oldName.trim()) {
                art.reference = name;
              }
            });
          }

          state.editingReferenceId = null;
          showToast('Data referensi berhasil diperbarui!');
        } else {
          state.references.push({ id: 'ref-' + Date.now(), ...payload });
          showToast('Referensi baru berhasil ditambahkan!');
        }
        renderApp({ preserveScroll: true });
        return;
      }

      try {
        if (state.editingReferenceId) {
          const existingRef = state.references.find(r => r.id === state.editingReferenceId);
          const oldName = existingRef ? existingRef.name : '';

          if (existingRef) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'references', state.editingReferenceId), payload);
          } else {
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'references'), payload);
          }

          if (oldName && oldName !== name) {
            const matchedArticles = state.articles.filter(a => (a.reference || '').trim() === oldName.trim());
            for (const art of matchedArticles) {
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', art.id), { reference: name });
            }
          }

          state.editingReferenceId = null;
          showToast('Referensi berhasil diperbarui di Firestore!');
        } else {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'references'), payload);
          showToast('Referensi baru berhasil disimpan ke Firestore!');
        }
        renderApp({ preserveScroll: true });
      } catch (err) {
        console.error(err);
        showToast('Gagal menyimpan referensi ke database.', 'error');
      }
    }

    function handleEditReference(refId, fallbackName) {
      if (state.currentUser?.role !== 'admin') return;
      saveCurrentScrollPosition();
      if (refId) {
        state.editingReferenceId = refId;
      } else if (fallbackName) {
        const newTempId = 'ref-' + Date.now();
        state.references.push({
          id: newTempId,
          name: fallbackName,
          description: ''
        });
        state.editingReferenceId = newTempId;
      }
      renderApp({ preserveScroll: true });
      const formEl = document.getElementById('reference-crud-form');
      if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function handleDeleteReference(refId, refName) {
      if (state.currentUser?.role !== 'admin') return;
      showConfirm(
        'Hapus Sumber/Referensi',
        `Yakin ingin menghapus referensi "${refName}"? Label referensi pada tulisan terkait juga akan dikosongkan.`,
        async () => {
          saveCurrentScrollPosition();
          if (IS_PREVIEW) {
            if (refId) {
              state.references = state.references.filter(r => r.id !== refId);
            }
            state.articles.forEach(art => {
              if ((art.reference || '').trim() === (refName || '').trim()) {
                art.reference = '';
              }
            });
            if (state.editingReferenceId === refId) state.editingReferenceId = null;
            showToast('Referensi berhasil dihapus.');
            renderApp({ preserveScroll: true });
            return;
          }

          try {
            if (refId) {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'references', refId));
            }
            const matchedArticles = state.articles.filter(a => (a.reference || '').trim() === (refName || '').trim());
            for (const art of matchedArticles) {
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'articles', art.id), { reference: '' });
            }
            if (state.editingReferenceId === refId) state.editingReferenceId = null;
            showToast('Referensi berhasil dihapus dari Firestore.');
          } catch (err) {
            showToast('Gagal menghapus referensi.', 'error');
          }
        }
      );
    }

    // ==========================================
    // 3. VIEW: HALAMAN BACA (TANPA KATA "OLEH: ...")
    // ==========================================
    function renderBacaView() {
      const isAdmin = state.currentUser?.role === 'admin';
      const art = state.articles.find(a => a.id === state.readingArticleId) || state.articles[0];
      if (!art) {
        return `<div class="p-8 text-center text-sm text-gray-500">Tulisan tidak ditemukan.</div>`;
      }

      const backTarget = state.previousMenu || 'koleksi';
      const backLabel = getMenuDisplayName(backTarget);

      const activeReadKeywords = backTarget === 'pencarian' ? getActiveSearchKeywords() : [];

      const isHtmlContent = /<[a-z][\s\S]*>/i.test(art.content || '');
      const rawFormattedBody = isHtmlContent
        ? art.content
        : String(art.content || '').split('\n').map(p => `<p>${escapeHtml(p)}</p>`).join('');

      const formattedBody = activeReadKeywords.length > 0
        ? highlightHtmlContent(rawFormattedBody, activeReadKeywords)
        : rawFormattedBody;

      const highlightedTitle = activeReadKeywords.length > 0
        ? highlightTextWithKeywords(art.title, activeReadKeywords)
        : escapeHtml(art.title);

      return `
        <div class="p-4 sm:p-8 max-w-4xl mx-auto w-full">
          <div class="bg-white rounded-3xl p-6 sm:p-10 border border-gray-100 shadow-sm">
            <!-- Navigasi Atas & Kontrol Ukuran Teks -->
            <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
              <button
                type="button"
                data-action="return-from-read"
                class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-xs font-semibold text-gray-700 transition"
              >
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Kembali ke ${escapeHtml(backLabel)}</span>
              </button>

              <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 bg-gray-100 p-1 rounded-xl border border-gray-200">
                  <button
                    type="button"
                    data-action="font-size-down"
                    class="px-2.5 py-1 rounded-lg hover:bg-white text-xs font-bold text-gray-700 transition"
                    title="Kecilkan Tulisan"
                  >
                    A-
                  </button>
                  <span id="reader-font-indicator" class="px-2 text-[11px] font-semibold text-gray-600">${state.readerFontSize}px</span>
                  <button
                    type="button"
                    data-action="font-size-up"
                    class="px-2.5 py-1 rounded-lg hover:bg-white text-xs font-bold text-gray-700 transition"
                    title="Perbesar Tulisan"
                  >
                    A+
                  </button>
                  <button
                    type="button"
                    data-action="font-size-reset"

    // ==========================================
    // 5. VIEW: PENCARIAN
    // ==========================================
    function renderPencarianView() {
      const isFullTextMode = state.searchMode === 'fulltext';
      const activeKeywords = getActiveSearchKeywords();

      const matchedArticles = state.articles.filter(a => {
        const normalizedCombined = normalizeSearchText([
          a.title || '',
          a.reference || '',
          a.categoryName || '',
          stripHtmlTags(a.content || '')
        ].join(' '));

        if (isFullTextMode) {
          const q = normalizeSearchText(state.searchQuery || '').trim();
          if (!q) return true;
          if (normalizedCombined.includes(q)) return true;
          const queryWords = q.split(/\s+/).filter(Boolean);
          return queryWords.every(w => normalizedCombined.includes(w));
        } else {
          const activeWords = (state.multiSearchWords || [])
            .map(w => normalizeSearchText(w || '').trim())
            .filter(Boolean);

          if (activeWords.length === 0) return true;
          return activeWords.every(word => normalizedCombined.includes(word));
        }
      });

      const matchedCategories = state.categories.filter(c => {
        const normalizedCat = normalizeSearchText([c.name || '', c.description || ''].join(' '));
        if (isFullTextMode) {
          const q = normalizeSearchText(state.searchQuery || '').trim();
          if (!q) return true;
          if (normalizedCat.includes(q)) return true;
          const queryWords = q.split(/\s+/).filter(Boolean);
          return queryWords.every(w => normalizedCat.includes(w));
        } else {
          const activeWords = (state.multiSearchWords || [])
            .map(w => normalizeSearchText(w || '').trim())
            .filter(Boolean);
          if (activeWords.length === 0) return true;
          return activeWords.every(word => normalizedCat.includes(word));
        }
      });

      return `
        <div class="p-4 sm:p-8 space-y-6 max-w-5xl mx-auto w-full">
          <div>
            <h1 class="text-xl sm:text-2xl font-bold text-gray-900">Pencarian</h1>
          </div>

          <div class="bg-white rounded-2xl p-5 sm:p-6 border border-gray-100 shadow-sm space-y-4">
            <div class="grid grid-cols-2 gap-2 p-1.5 bg-gray-100 rounded-2xl">
              <button
                type="button"
                data-action="set-search-mode"
                data-mode="fulltext"
                class="py-2.5 px-4 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition ${
                  isFullTextMode
                    ? 'bg-[#0D342C] text-white shadow-sm'
                    : 'text-gray-600 hover:text-gray-900'
                }"
              >
                <i data-lucide="file-search" class="w-4 h-4"></i>
                <span>Pencarian Full Teks</span>
              </button>

              <button
                type="button"
                data-action="set-search-mode"
                data-mode="multikata"
                class="py-2.5 px-4 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition ${
                  !isFullTextMode
                    ? 'bg-[#0D342C] text-white shadow-sm'
                    : 'text-gray-600 hover:text-gray-900'
                }"
              >
                <i data-lucide="columns-4" class="w-4 h-4"></i>
                <span>Pencarian Multi Kata</span>
              </button>
            </div>

            ${isFullTextMode ? `
              <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                <input
                  id="main-search-input"
                  type="text"
                  placeholder="Cari judul, referensi, kategori, atau isi (mendukung Arab tanpa harakat)..."
                  value="${escapeHtml(state.searchQuery)}"
                  class="w-full pl-11 pr-10 py-3.5 rounded-xl bg-gray-50 focus:bg-white border border-gray-200 text-sm text-gray-900 focus:border-[#0D342C] outline-none transition"
                />
                ${state.searchQuery ? `
                  <button
                    type="button"
                    data-action="clear-search"
                    class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-gray-400 hover:text-gray-700"
                    title="Bersihkan"
                  >
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>
                ` : ''}
              </div>
            ` : `
              <div class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                  ${[0, 1, 2, 3].map(idx => `
                    <div>
                      <input
                        type="text"
                        data-multi-index="${idx}"
                        value="${escapeHtml(state.multiSearchWords[idx] || '')}"
                        placeholder="Kata kunci ${idx + 1}..."
                        class="multi-search-input w-full px-3.5 py-2.5 rounded-xl bg-gray-50 focus:bg-white border border-gray-200 text-xs sm:text-sm text-gray-900 focus:border-[#0D342C] outline-none transition"
                      />
                    </div>
                  `).join('')}
                </div>
                ${state.multiSearchWords.some(w => w.trim()) ? `
                  <div class="flex justify-end">
                    <button
                      type="button"
                      data-action="clear-multi-search"
                      class="text-xs font-semibold text-red-600 hover:underline flex items-center gap-1"
                    >
                      <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                      <span>Reset</span>
                    </button>
                  </div>
                ` : ''}
              </div>
            `}
          </div>

          <div class="flex items-center gap-2">
            ${[
              { id: 'semua', label: `Semua (${matchedArticles.length + matchedCategories.length})` },
              { id: 'tulisan', label: `Tulisan (${matchedArticles.length})` },
              { id: 'kategori', label: `Kategori (${matchedCategories.length})` }
            ].map(t => `
              <button
                type="button"
                data-action="set-search-tab"
                data-tab="${t.id}"
                class="px-4 py-2 rounded-xl text-xs font-semibold transition ${
                  state.searchTab === t.id
                    ? 'bg-[#0D342C] text-white'
                    : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-100'
                }"
              >
                ${t.label}
              </button>
            `).join('')}
          </div>

          ${(state.searchTab === 'semua' || state.searchTab === 'tulisan') ? `
            <div class="space-y-3.5">
              ${matchedArticles.length === 0 ? `
                <div class="bg-white rounded-2xl p-8 text-center text-xs text-gray-400 border border-gray-100">
                  Tidak ada hasil ditemukan.
                </div>
              ` : matchedArticles.map(art => {
                const currentExpandLevel = state.expandedSearchSnippets[art.id] || 0;
                const snippetObj = getSmartSearchSnippets(art.content, activeKeywords, currentExpandLevel);

                return `
                  <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm hover:border-emerald-300 hover:shadow-md transition group">

                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Terjemah Doa/Ayat Beranda</label>
                    <input
                      id="set-daily-translation"
                      type="text"
                      value="${escapeHtml(cfg.dailyTranslation)}"
                      class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs focus:border-[#0D342C] outline-none"
                    />
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-semibold text-gray-700 mb-1">Kutipan Hadits Halaman Login</label>
                  <input
                    id="set-login-quote"
                    type="text"
                    value="${escapeHtml(cfg.loginQuote)}"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-xs focus:border-[#0D342C] outline-none"
                  />
                </div>

                <button
                  type="submit"
                  class="w-full py-3.5 rounded-xl bg-[#0D342C] hover:bg-[#164E42] text-white text-xs font-bold shadow-md transition flex items-center justify-center gap-2"
                >
                  <i data-lucide="save" class="w-4 h-4"></i>
                  <span>Simpan & Terapkan Real-Time</span>
                </button>
              </form>
            </div>

            <div class="lg:col-span-5 space-y-5">
              <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm space-y-4">
                <div class="flex items-center gap-2.5 pb-3 border-b border-gray-100">
                  <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-700 flex items-center justify-center">
                    <i data-lucide="users" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h3 class="text-sm font-bold text-gray-900">Manajemen Akun Anggota</h3>
                  </div>
                </div>

                <form id="user-form" class="space-y-3">
                  <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Lengkap Anggota</label>
                    <input id="usr-fullname" type="text" placeholder="Misal: Fatimah Az-Zahra" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-xs outline-none" required />
                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-semibold text-gray-700 mb-1">Username Login</label>
                      <input id="usr-username" type="text" placeholder="fatimah" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-xs outline-none" required />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
                      <input id="usr-password" type="text" placeholder="••••••" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 text-xs outline-none" required />
                    </div>
                  </div>
                  <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold transition">
                    + Tambah Akun Anggota
                  </button>
                </form>

                <div class="pt-3 border-t border-gray-100 space-y-2">
                  <div class="text-xs font-bold text-gray-700">Daftar Anggota Terdaftar (${state.users.length})</div>
                  ${state.users.length === 0 ? `
                    <p class="text-xs text-gray-400 py-3">Belum ada akun anggota terdaftar.</p>
                  ` : state.users.map(u => `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-gray-50 border border-gray-100">
                      <div>
                        <div class="text-xs font-bold text-gray-900">${escapeHtml(u.fullName)}</div>
                        <div class="text-[11px] text-gray-500">Username: <code class="font-semibold text-emerald-800">${escapeHtml(u.username)}</code></div>
                      </div>
                      <button type="button" data-action="delete-user" data-id="${u.id}" class="p-1.5 rounded-lg text-red-500 hover:bg-red-50">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // RENDER UTAMA APLIKASI
    // ==========================================
    function renderApp(options = {}) {
      applyThemeMode();
      const container = document.getElementById('app-view');
      if (!container) return;

      const prevWs = document.getElementById('main-workspace-scroll');
      const currentScrollTop = prevWs ? prevWs.scrollTop : 0;

      if (!state.currentUser) {
        container.innerHTML = renderLoginView();
        lucide.createIcons();
        bindEvents();
        return;
      }

      if (state.currentUser.role !== 'admin' && (state.activeMenu === 'pengaturan' || state.activeMenu === 'tulis')) {
        state.activeMenu = 'beranda';
      }

      let contentHtml = '';
      switch (state.activeMenu) {
        case 'beranda':
          contentHtml = renderBerandaView();
          break;
        case 'koleksi':
          contentHtml = renderKoleksiView();
          break;
        case 'baca':
          contentHtml = renderBacaView();
          break;
        case 'kategori':
          contentHtml = renderKategoriView();
          break;
        case 'referensi':
          contentHtml = renderReferensiView();
          break;
        case 'pencarian':
          contentHtml = renderPencarianView();
          break;
        case 'tulis':
          contentHtml = renderTulisView();
          break;
        case 'favorit':
          contentHtml = renderFavoritView();
          break;
        case 'pengaturan':
          contentHtml = renderPengaturanView();
          break;
        default:
          contentHtml = renderBerandaView();
      }

      container.innerHTML = `
        <div class="w-full h-full flex overflow-hidden bg-alabaster">
          ${renderNavigation()}
          <div id="main-workspace-scroll" class="main-workspace flex-1 flex flex-col h-full overflow-y-auto">
            ${renderTopbar()}
            <main class="flex-1">
              ${contentHtml}
            </main>
          </div>
        </div>
      `;

      lucide.createIcons();
      bindEvents();

      const newWs = document.getElementById('main-workspace-scroll');
      if (newWs) {
        if (options.preserveScroll) {
          newWs.scrollTop = currentScrollTop;
        } else if (options.restoreMenuScroll) {
          const savedScroll = state.menuScrollPositions[state.activeMenu] || 0;
          newWs.scrollTop = savedScroll;
        } else if (state.activeMenu === 'baca') {
          newWs.scrollTop = 0;
        }
      }
    }

    // ==========================================
    // EVENT DELEGATION & BINDINGS
    // ==========================================
    function bindEvents() {
      const loginForm = document.getElementById('login-form');
      if (loginForm) loginForm.onsubmit = handleLogin;

      const articleForm = document.getElementById('article-form');
      if (articleForm) articleForm.onsubmit = handleSaveArticle;

      const categoryForm = document.getElementById('category-form');
      if (categoryForm) categoryForm.onsubmit = handleSaveCategory;

      const referenceCrudForm = document.getElementById('reference-crud-form');
      if (referenceCrudForm) referenceCrudForm.onsubmit = handleSaveReference;

      const settingsForm = document.getElementById('settings-form');
      if (settingsForm) settingsForm.onsubmit = handleSaveSettings;

      const userForm = document.getElementById('user-form');
      if (userForm) userForm.onsubmit = handleAddUser;

      const wsScroll = document.getElementById('main-workspace-scroll');
      if (wsScroll) {
        wsScroll.addEventListener('scroll', () => {
          if (state.activeMenu !== 'baca') {
            state.menuScrollPositions[state.activeMenu] = wsScroll.scrollTop;
          }
        }, { passive: true });
      }

      document.querySelectorAll('[data-action="quick-search-input"]').forEach(inp => {
        inp.onkeydown = (e) => {
          if (e.key === 'Enter') {
            state.searchMode = 'fulltext';
            state.searchQuery = e.target.value;
            state.activeMenu = 'pencarian';
            renderApp();
          }
        };
      });

      const mainSearchInput = document.getElementById('main-search-input');
      if (mainSearchInput) {
        mainSearchInput.oninput = (e) => {
          state.searchQuery = e.target.value;
          state.expandedSearchSnippets = {};
          renderApp({ preserveScroll: true });
          const el = document.getElementById('main-search-input');
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        };
      }

      document.querySelectorAll('.multi-search-input').forEach(inp => {
        inp.oninput = (e) => {
          const idx = parseInt(inp.getAttribute('data-multi-index'), 10);
          const caretPos = e.target.selectionStart;
          state.multiSearchWords[idx] = e.target.value;
          state.expandedSearchSnippets = {};
          renderApp({ preserveScroll: true });
          const targetEl = document.querySelector(`.multi-search-input[data-multi-index="${idx}"]`);
          if (targetEl) {
            targetEl.focus();
            targetEl.setSelectionRange(caretPos, caretPos);
          }
        };
      });

      const themeSelect = document.getElementById('set-theme-mode');
      if (themeSelect) {
        themeSelect.onchange = (e) => {
          state.appConfig.themeMode = e.target.value;
          applyThemeMode();
        };
      }

      const editorFontSelect = document.getElementById('editor-font-family');
      if (editorFontSelect) {
        editorFontSelect.onchange = (e) => {
          const fontVal = e.target.value;
          if (fontVal) {
            applyFontFamilyToSelection(fontVal);
            e.target.value = '';
          }
        };
      }

      document.querySelectorAll('[data-action]').forEach(el => {
        const action = el.getAttribute('data-action');
        if (action === 'quick-search-input' || action === 'instant-theme-toggle') return;

        if (['rich-cmd', 'rich-insert', 'block-dir', 'block-align'].includes(action)) {
          el.onmousedown = (ev) => ev.preventDefault();
        }

        el.onclick = (e) => {
          e.stopPropagation();

          if (action === 'switch-login-tab') {
            state.loginTab = el.getAttribute('data-tab');
            renderApp();
          } else if (action === 'toggle-password') {
            state.showPassword = !state.showPassword;
            renderApp();
          } else if (action === 'quick-theme-toggle') {
            toggleQuickThemeMode();
          } else if (action === 'nav') {
            saveCurrentScrollPosition();
            const targetMenu = el.getAttribute('data-menu');
            if (state.currentUser?.role !== 'admin' && (targetMenu === 'pengaturan' || targetMenu === 'tulis')) {
              showToast('Akses terbatas: Pembaca hanya memiliki hak akses baca (Read-Only).', 'info');
              return;
            }
            if (targetMenu === 'tulis') state.editingArticleId = null;
            state.activeMenu = targetMenu;
            renderApp({ restoreMenuScroll: true });
          } else if (action === 'logout') {
            handleLogout();
          } else if (action === 'read-article') {
            if (state.activeMenu !== 'baca') {
              saveCurrentScrollPosition(state.activeMenu);
              state.previousMenu = state.activeMenu;
            }
            state.readingArticleId = el.getAttribute('data-id');
            state.activeMenu = 'baca';
            renderApp();
          } else if (action === 'return-from-read') {
            state.activeMenu = state.previousMenu || 'koleksi';
            renderApp({ restoreMenuScroll: true });
          } else if (action === 'expand-search-snippet') {
            const artId = el.getAttribute('data-id');
            const curr = state.expandedSearchSnippets[artId] || 0;
            state.expandedSearchSnippets[artId] = Math.min(3, curr + 1);
            renderApp({ preserveScroll: true });
          } else if (action === 'collapse-search-snippet') {
            const artId = el.getAttribute('data-id');
            const curr = state.expandedSearchSnippets[artId] || 0;
            state.expandedSearchSnippets[artId] = Math.max(0, curr - 1);
            renderApp({ preserveScroll: true });
          } else if (action === 'toggle-category-accordion') {
            const catId = el.getAttribute('data-cat-id');
            state.expandedCategories[catId] = !state.expandedCategories[catId];
            renderApp({ preserveScroll: true });
          } else if (action === 'toggle-reference-accordion') {
            const refName = el.getAttribute('data-ref-name');
            state.expandedReferences[refName] = !state.expandedReferences[refName];
            renderApp({ preserveScroll: true });
          } else if (action === 'edit-reference') {
            const refId = el.getAttribute('data-id');
            const refName = el.getAttribute('data-name');
            handleEditReference(refId, refName);
          } else if (action === 'cancel-edit-reference') {
            state.editingReferenceId = null;
            renderApp({ preserveScroll: true });
          } else if (action === 'delete-reference') {
            const refId = el.getAttribute('data-id');
            const refName = el.getAttribute('data-name');
            handleDeleteReference(refId, refName);
          } else if (action === 'goto-category-expand') {
            saveCurrentScrollPosition();
            const catId = el.getAttribute('data-cat-id');
            state.expandedCategories[catId] = true;
            state.activeMenu = 'kategori';
            renderApp();
          } else if (action === 'select-cat-filter') {
            state.selectedCategoryFilter = el.getAttribute('data-cat-id');
            renderApp({ preserveScroll: true });
          } else if (action === 'filter-category-goto') {
            saveCurrentScrollPosition();
            state.selectedCategoryFilter = el.getAttribute('data-cat-id');
            state.activeMenu = 'koleksi';
            renderApp();
          } else if (action === 'toggle-fav') {
            const id = el.getAttribute('data-id');
            const fav = el.getAttribute('data-fav') === 'true';
            toggleFavoriteArticle(id, fav);
          } else if (action === 'edit-article') {
            if (state.currentUser?.role !== 'admin') return;
            state.editingArticleId = el.getAttribute('data-id');
            state.activeMenu = 'tulis';
            renderApp();
          } else if (action === 'delete-article') {
            handleDeleteArticle(el.getAttribute('data-id'));
          } else if (action === 'delete-category') {
            handleDeleteCategory(el.getAttribute('data-id'));
          } else if (action === 'set-search-mode') {
            state.searchMode = el.getAttribute('data-mode');
            state.expandedSearchSnippets = {};
            renderApp({ preserveScroll: true });
          } else if (action === 'clear-search') {
            state.searchQuery = '';
            state.expandedSearchSnippets = {};
            renderApp({ preserveScroll: true });
          } else if (action === 'clear-multi-search') {
            state.multiSearchWords = ['', '', '', ''];
            state.expandedSearchSnippets = {};
            renderApp({ preserveScroll: true });
          } else if (action === 'set-search-tab') {
            state.searchTab = el.getAttribute('data-tab');
            renderApp({ preserveScroll: true });
          } else if (action === 'rich-cmd') {
            const cmd = el.getAttribute('data-cmd');
            const val = el.getAttribute('data-val') || null;
            const board = document.getElementById('rich-editor-board');
            if (board) {
              board.focus();
              document.execCommand(cmd, false, val);
            }
          } else if (action === 'rich-insert') {
            const snippet = el.getAttribute('data-snippet') || '';
            const board = document.getElementById('rich-editor-board');
            if (board) {
              board.focus();
              document.execCommand('insertText', false, snippet);
            }
          } else if (action === 'block-dir') {
            const dir = el.getAttribute('data-dir');
            applyBlockFormatToSelection({ dir });
          } else if (action === 'block-align') {
            const align = el.getAttribute('data-align');
            applyBlockFormatToSelection({ align });
          } else if (action === 'font-size-up') {
            state.readerFontSize = Math.min(32, state.readerFontSize + 2);
            const bodyEl = document.getElementById('reader-article-body');
            const indEl = document.getElementById('reader-font-indicator');
            if (bodyEl) bodyEl.style.fontSize = `${state.readerFontSize}px`;
            if (indEl) indEl.textContent = `${state.readerFontSize}px`;
          } else if (action === 'font-size-down') {
            state.readerFontSize = Math.max(12, state.readerFontSize - 2);
            const bodyEl = document.getElementById('reader-article-body');
            const indEl = document.getElementById('reader-font-indicator');
            if (bodyEl) bodyEl.style.fontSize = `${state.readerFontSize}px`;
            if (indEl) indEl.textContent = `${state.readerFontSize}px`;
          } else if (action === 'font-size-reset') {
            state.readerFontSize = 16;
            const bodyEl = document.getElementById('reader-article-body');
            const indEl = document.getElementById('reader-font-indicator');
            if (bodyEl) bodyEl.style.fontSize = `16px`;
            if (indEl) indEl.textContent = `16px`;
          } else if (action === 'reset-default-logo') {
            const logoInp = document.getElementById('set-app-logo');
            const previewImg = document.getElementById('live-logo-preview');
            if (logoInp) logoInp.value = DEFAULT_LOGO_SVG;
            if (previewImg) previewImg.src = DEFAULT_LOGO_SVG;
            showToast('Logo dikembalikan ke kubah emas default.');
          } else if (action === 'delete-user') {
            handleDeleteUser(el.getAttribute('data-id'));
          }
        };
      });
    }

    // Jalankan Aplikasi
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', () => renderApp());
    } else {
      renderApp();
    }
  </script>
</body>
</html>
